[project]
name = "paperkist"
version = "0.0.0"
description = "An encrypted local vault for personal paperwork, with search and expiry reminders."
readme = "README.md"
license-files = ["LICENSE"]
# Floor and ceiling: docs/decisions/ADR-0002-python.md. The ceiling is the
# pinned PySide6's; move it only when PySide6 is bumped.
requires-python = ">=3.12,<3.15"
dependencies = [
    "PyNaCl==1.6.2",
    "pyside6==6.11.2",
]

[dependency-groups]
# Pinned here and nowhere else: scripts/local-ci.sh runs these through
# `uv run --locked`, so the local gate and CI use the same versions.
dev = [
    "pytest==9.1.1",
    "pytest-randomly==5.0.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperkist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff.lint]
# An explicit set, because `select` replaces ruff's defaults and those
# change between releases (standards/languages/python.md, Traps).
select = [
    "E4", "E7", "E9", "F",  # ruff's historical defaults
    "B",                    # likely bugs
    "UP",                   # modern syntax for the version floor
    "PTH",                  # pathlib over os.path
    "BLE",                  # no blind `except Exception`
    "S",                    # security (bandit)
    "N",                    # PEP 8 naming
    "RUF100",               # a noqa that no longer suppresses anything
]
# N818 wants an "Error" suffix; the error names are fixed by
# docs/specs/DEED-0002-vault-format.md § 4.6 and read as sentences in ui.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest asserts
