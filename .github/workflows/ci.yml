# This workflow sets up a machine and CALLS the gate script. It restates no
# step of it, and no check may be added here.
#
# `local-gate.md` § 3: the local run must execute the pipeline's own
# definition, not a copy. Everything CI does lives in scripts/local-ci.sh, so
# the run before your push and the run on GitHub cannot disagree. Adding a step
# here instead creates a second list, and the drift is discovered by a red
# build — the thing running locally was meant to prevent.
#
# Setup (installing a toolchain, checking out, caching) belongs here. Checks
# belong in the script.
name: ci

on:
  push:
    branches: [main]
    # local-gate.md § 9. A push touching only documentation skips this run;
    # the pre-push hook has already run the documentation checks on it. This
    # is scripts/local-ci.sh's DOCS_GLOB (`docs/*|*.md|LICENSE`) in GitHub's
    # syntax, and the two change together. Pull requests still run everything.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read

# local-gate.md § 9. A newer push to the same branch cancels the run it
# replaced — but never on main, where a cancelled run would hide which commit
# broke it. The event is in the key so a push and a pull request never cancel
# or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  gate:
    # Every push runs on all three systems, at the Python floor and ceiling
    # (docs/decisions/ADR-0002-python.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    # local-gate.md § 9. A hung job otherwise burns up to six hours. There is
    # no cache, so every run is cold; the slowest measured cold job was under
    # two minutes (Windows, 2026-09-28).
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Pinned by digest: a tag is mutable and runs a different program on the
      # day it changes (security.md § 8).
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Qt's window code loads the system's EGL and OpenGL libraries even when
      # it draws offscreen, and GitHub's Ubuntu image lacks them (the window
      # tests failed to import libEGL.so.1, 2026-10-08). Setup, not a check.
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      # uv's version is pinned in the script; every other tool is locked in
      # uv.lock and run through it.
      - name: Install uv
        run: python -m pip install "uv==$(./scripts/local-ci.sh --uv-version)"

      - name: Run the gate
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: ./scripts/local-ci.sh
